<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11+ Progress Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#1b2a3a;--mut:#5b6b7b;--line:#dbe3ea;--a:#2a7f8e;--b:#1f3a5f;--ok:#2e9e6a;--bad:#d1495b;--warn:#e0a030;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181f;--card:#18232d;--ink:#e6edf3;--mut:#9fb0bf;--line:#2a3a48;--a:#4fb3c4;--b:#8fb0e0}}
:root[data-theme="dark"]{--bg:#10181f;--card:#18232d;--ink:#e6edf3;--mut:#9fb0bf;--line:#2a3a48;--a:#4fb3c4;--b:#8fb0e0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:24px;margin:0 0 2px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
.sub{color:var(--mut);margin:0 0 14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;cursor:pointer;font:inherit}
nav button.on{background:var(--b);color:#fff;border-color:var(--b)}
.g{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:26px;color:var(--b)}.kpi span{color:var(--mut);font-size:13px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:18px;border-bottom:1px solid var(--line)}
.grp{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%}
.bar{width:100%;max-width:26px;border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bar i{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-style:normal;color:var(--mut)}
.lab{display:flex;gap:10px;margin-top:4px}.lab div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.leg{font-size:12px;color:var(--mut);margin-top:8px}.leg s{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;text-decoration:none}
.hr{display:grid;grid-template-columns:130px 1fr 28px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hb{height:9px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}.hb u{display:block;height:100%;text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--line);font-size:11px;color:var(--mut)}
details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card)}summary{padding:10px 12px;cursor:pointer;font-weight:600}details>div{padding:0 12px 10px;overflow-x:auto}
.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th figure{margin:0;cursor:pointer}.th img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.th figcaption{font-size:12px;color:var(--mut);margin-top:3px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}#lb img{max-width:100%;max-height:100%;border-radius:6px}
.bk a{color:var(--a);font-weight:600}ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0}input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}button.pri{background:var(--b);color:#fff;border-color:var(--b)}code{font-size:12px}
</style></head><body><div class="w">
<h1>11+ Progress Dashboard</h1><p class="sub">Year 4 · weekly practice packs · marked scans and booklets in one place</p>
<nav id="nav"></nav><div id="v"></div></div>
<div id="lb" onclick="this.style.display='none'"><img alt="Scan"></div>
<script>
const IMG={"w1-mon": "assets/scans/week1/mon.jpg", "w1-tue": "assets/scans/week1/tue.jpg", "w1-wed": "assets/scans/week1/wed.jpg", "w1-thu": "assets/scans/week1/thu.jpg", "w1-fri": "assets/scans/week1/fri.jpg", "w1-wkd": "assets/scans/week1/wkd.jpg", "w2-mon": "assets/scans/week2/mon.jpg", "w2-tue": "assets/scans/week2/tue.jpg", "w2-wed": "assets/scans/week2/wed.jpg", "w2-thu": "assets/scans/week2/thu.jpg", "w2-fri": "assets/scans/week2/fri.jpg", "w2-wkd": "assets/scans/week2/wkd.jpg"};const STANDALONE=false;
const BK=[["Guide + Week 1 pack (Word)","11plus_Guide_and_Week1_Pack.docx","Topic guide, Week 1 questions and answer key"],["Guide + Week 1 pack (PDF)","11plus_Guide_and_Week1_Pack.pdf","Printable version"],["Week 2 pack (Word)","11plus_Week2_Practice_Pack.docx","Week 2 questions, vocabulary and answer key"],["Week 3 pack (Word)","11plus_Week3_Practice_Pack.docx","Week 3 questions (all four subjects), vocabulary and answer key"],["Week 4 pack (Word)","11plus_Week4_Practice_Pack.docx","Week 4 questions built around the Week 3 gaps, with warm-ups and answer key"]];
const L=[["mon","Mon"],["tue","Tue"],["wed","Wed"],["thu","Thu"],["fri","Fri"],["wkd","Wknd"]];
const AL=[20,15,20,20,15,15];
const D=[[["Maths: number",13,14,null,[[12,"9 classes × 28 children","196","252","Multiplication"]]],
["Verbal Reasoning",7,10,null,[[6,"Word ladder CAT to DOG","DOT","COT, COG","Codes & word play"],[8,"Letter code: DOG","—","EPH","Codes & word play"],[9,"Anagram of LISTEN","Entlis","SILENT","Codes & word play"]]],
["Maths: fractions, measures, shape",10,14,null,[[6,"0.5 as a fraction","0.5","1/2","Fractions & decimals"],[7,"Area, 7 cm × 5 cm","24 cm","35 sq cm","Measures"],[10,"Film 2:45 pm + 1 h 50","4:45 pm","4:35 pm","Measures"],[13,"5 apples cost £2.20: one apple","54p","44p","Measures"]]],
["English",9,12,null,[[1,"Time of day in the story","in the morning","early morning, before sunrise (acceptable)","Comprehension"],[3,"What “glittered … like diamonds” tells you","It was looking cool","sparkled or shone brightly","Comprehension"],[9,"Punctuate speech","blank","“Where are you going?” asked Mum.","Grammar & spelling"]]],
["Non-Verbal Reasoning",8,11,null,[[6,"Reflect an arrow pointing left","left","right","Shape & spatial"],[8,"Squares in a 2 × 2 grid","4 × 4","5","Shape & spatial"],[10,"Dot moves 3 corners clockwise","south east","bottom-left","Shape & spatial"]]],
["Mixed quiz",9,10,null,[[4,"Next: 3, 6, 12, 24","27","48","Sequences"]]]],
[["Maths: multiplication and division",14,14,7,[]],
["Verbal Reasoning",8,10,10,[[7,"Next: Z, X, V, T","V","R","Sequences"],[9,"Code (A=1): DOG","4-14-7","4-15-7","Codes & word play"]]],
["Maths: decimals, money, time, shape",9,14,14,[[1,"3/10 as a decimal","1.3","0.3","Fractions & decimals"],[5,"10 − 6.25","4.75","3.75","Fractions & decimals"],[6,"2/3 = ?/12","4","8","Fractions & decimals"],[7,"Simplify 6/8","—","3/4","Fractions & decimals"],[8,"Change from £5 for 3 × £1.35","£3.65","95p","Measures"]]],
["English",8,12,14,[[2,"Why Priya held Gran’s hand","so she doesn’t get lost","afraid the crowd would sweep her away (arguably acceptable)","Comprehension"],[5,"How Priya feels, with evidence","Afraid (no evidence)","one word plus a phrase from the text","Comprehension"],[6,"Meaning of “reassuring”","—","comforting, easing worry","Comprehension"],[7,"Adverb in “ran quickly”","ran","quickly","Grammar & spelling"]]],
["Non-Verbal Reasoning",8,11,12,[[2,"Triangle turned 180°","right","down","Shape & spatial"],[6,"Triangles in a square with both diagonals","12","8","Shape & spatial"],[11,"Edges of a cube","8","12","Shape & spatial"]]],
["Mixed quiz",6,10,7,[[4,"Next: 1, 4, 9, 16","26","25","Sequences"],[5,"Plural of baby","babyes","babies","Grammar & spelling"],[8,"Sides of a hexagon","5","6","Shape & spatial"],[10,"Punctuate: its a lovely day said Sam","blank","“It’s a lovely day,” said Sam.","Grammar & spelling"]]]]];
const COL=["#2a7f8e","#1f3a5f","#e0a030","#d1495b","#7a5bd1","#2e9e6a","#c46a2d","#4a6fa5"];
const P=(s,m)=>m?Math.round(100*s/m):0,sum=(a,f)=>a.reduce((x,r)=>x+f(r),0),$=i=>document.getElementById(i);
const E=$("v"),UI=typeof claude!=="undefined";
let R=[],DB=null,TAB="overview",MSG="";
const seed=[];D.forEach((w,wi)=>w.forEach((d,i)=>seed.push({id:`w${wi+1}-${L[i][0]}`,w:wi+1,k:L[i][0],s:d[0],sc:d[1],mx:d[2],t:d[3],wr:d[4]})));
const WK=()=>[...new Set(R.map(r=>r.w))].sort((a,b)=>a-b),rw=w=>R.filter(r=>r.w==w),tot=w=>[sum(rw(w),r=>r.sc),sum(rw(w),r=>r.mx)];
const li=k=>L.findIndex(l=>l[0]==k),im=r=>IMG[r.id]||r.img||"";
const leg=()=>'<div class="leg">'+WK().map((w,i)=>`<s style="background:${COL[i%8]}"></s>Week ${w}`).join("")+'</div>';
function bars(){let h='<div class="bars">';L.forEach(l=>{h+='<div class="grp">'+WK().map((w,i)=>{const r=rw(w).find(x=>x.k==l[0]);if(!r)return"";const p=P(r.sc,r.mx);return `<div class="bar" style="height:${p}%;background:${COL[i%8]}"><i>${p}</i></div>`}).join("")+'</div>'});
return h+'</div><div class="lab">'+L.map(l=>`<div>${l[1]}</div>`).join("")+'</div>'+leg()}
function trend(){const ws=WK();return '<div class="bars">'+ws.map((w,i)=>{const t=tot(w),p=P(...t);return `<div class="grp"><div class="bar" style="height:${p}%;background:${COL[i%8]};max-width:40px"><i>${p}%</i></div></div>`}).join("")+'</div><div class="lab">'+ws.map(w=>`<div>Wk ${w}</div>`).join("")+'</div>'}
function times(){const w=[...WK()].reverse().find(w=>rw(w).some(r=>r.t));if(!w)return"<p class='sub'>No times recorded yet.</p>";
return `<p class="sub">Week ${w}</p><div class="bars">`+L.map((l,i)=>{const r=rw(w).find(x=>x.k==l[0]),t=r?r.t||0:0,a=AL[i];return `<div class="grp"><div class="bar" style="height:${100*a/25}%;background:var(--line)"><i>${a}</i></div><div class="bar" style="height:${100*t/25}%;background:var(--warn)"><i>${t}</i></div></div>`}).join("")+'</div><div class="lab">'+L.map(l=>`<div>${l[1]}</div>`).join("")+'</div><div class="leg"><s style="background:var(--line)"></s>Allowed<s style="background:var(--warn)"></s>Taken (min)</div>'}
function tg(){const c={};R.forEach(r=>(r.wr||[]).forEach(x=>{(c[x[4]]=c[x[4]]||{})[r.w]=(c[x[4]][r.w]||0)+1}));return c}
function tags(){const c=tg(),ws=WK(),r=Object.entries(c).map(([t,o])=>[t,o,sum(Object.values(o),x=>x)]).sort((a,b)=>b[2]-a[2]),m=Math.max(1,...r.map(x=>x[2]));
return r.map(x=>`<div class="hr"><span>${x[0]}</span><div class="hb">${ws.map((w,i)=>`<u style="width:${100*(x[1][w]||0)/m}%;background:${COL[i%8]}"></u>`).join("")}</div><b>${x[2]}</b></div>`).join("")+leg()}
function ins(){const ws=WK(),c=tg(),o=[],l=ws[ws.length-1],p=ws[ws.length-2];if(l!=null&&p!=null){const a=P(...tot(l)),b=P(...tot(p));o.push(`Week ${l}: <b>${a}%</b> (${a-b>=0?"+":""}${a-b} points vs week ${p}). Harder weeks can dip, so compare skills as well as totals.`)}
const top=Object.entries(c).map(([t,x])=>[t,sum(Object.values(x),y=>y)]).sort((a,b)=>b[1]-a[1]).slice(0,3);if(top.length)o.push("Most mistakes: "+top.map(x=>`<b>${x[0]}</b> (${x[1]})`).join(", ")+".");
const rec=Object.entries(c).filter(([t,x])=>Object.keys(x).length>1).map(x=>x[0]);if(rec.length)o.push("Appearing in more than one week: <b>"+rec.join(", ")+"</b>. Worth a focused refresher.");
const f=R.filter(r=>r.sc==r.mx).map(r=>`W${r.w} ${L[li(r.k)][1]}`);if(f.length)o.push("Full marks: "+f.join(", ")+".");
return "<ul>"+o.map(x=>`<li>${x}</li>`).join("")+"</ul>"}
function over(){const ws=WK();if(!ws.length)return"<p>No data yet. Use the Add day tab.</p>";
let h='<div class="g k">'+ws.slice(-3).map((w,i,a)=>{const t=tot(w),p=P(...t),q=ws[ws.indexOf(w)-1],d=q!=null?p-P(...tot(q)):null;return `<div class="card kpi"><b>${t[0]}/${t[1]}</b><span>Week ${w} · ${p}% ${d==null?"":`<span class="${d<0?"dn":"up"}">(${d>0?"+":""}${d})</span>`}</span></div>`}).join("")+`<div class="card kpi"><b>${R.length}</b><span>Tests recorded</span></div></div>`;
return h+`<div class="g c2" style="margin-top:12px"><div class="card"><h2>Weekly total (%)</h2>${trend()}</div><div class="card"><h2>Score by day (%)</h2>${bars()}</div><div class="card"><h2>Where marks are lost</h2>${tags()}</div><div class="card"><h2>Time taken vs allowed</h2>${times()}</div><div class="card" style="grid-column:1/-1"><h2>Findings</h2>${ins()}</div></div>`}
function rev(){return WK().slice().reverse().map(w=>`<h3>Week ${w}: ${tot(w).join("/")}</h3>`+rw(w).sort((a,b)=>li(a.k)-li(b.k)).map(r=>`<details><summary>${L[li(r.k)][1]} · ${r.s} · ${r.sc}/${r.mx} (${P(r.sc,r.mx)}%)${r.t?" · "+r.t+" min":""}</summary><div>`+((r.wr||[]).length?`<table><tr><th>Q</th><th>Question</th><th>Answered</th><th>Correct</th><th>Skill</th></tr>${r.wr.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td><span class="tag">${x[4]}</span></td></tr>`).join("")}</table>`:"<p>Full marks.</p>")+"</div></details>").join("")).join("")}
function scans(){return WK().slice().reverse().map(w=>`<h3>Week ${w} marked tests</h3><div class="th">`+rw(w).sort((a,b)=>li(a.k)-li(b.k)).filter(im).map(r=>`<figure onclick="zoom('${r.id}')"><img loading="lazy" src="${im(r)}" alt="Week ${w} ${r.k}" onerror="this.style.opacity=.2"><figcaption>${L[li(r.k)][1]} · ${r.sc}/${r.mx}</figcaption></figure>`).join("")+"</div>").join("")}
function zoom(k){const r=R.find(x=>x.id==k);$("lb").querySelector("img").src=im(r);$("lb").style.display="flex"}
function bk(){return (STANDALONE?'<div class="card" style="margin-bottom:10px">Downloads work in the GitHub version (<code>assets/booklets</code>). This view lists the files only.</div>':'')+'<div class="g c2">'+BK.map(b=>`<div class="card bk"><h2>${b[0]}</h2><p class="sub">${b[2]}</p>${STANDALONE?`<code>${b[1]}</code>`:`<a href="assets/booklets/${b[1]}" download>Download ${b[1].split(".").pop().toUpperCase()}</a>`}</div>`).join("")+"</div>"}
function add(){const ws=WK(),w=ws.length?ws[ws.length-1]:1,used=rw(w).map(r=>r.k),nx=L.find(l=>!used.includes(l[0])),W=nx?w:w+1,K=nx?nx[0]:"mon",i=li(K);
return `<div class="card"><h2>Add a day’s marks</h2><p class="sub">${UI?"Saved marks update this dashboard straight away.":"Fill in, then copy the JSON line into data/records.json (and add the scan photo)."}</p><div class="g c2">
<label>Week<br><input id="aw" type="number" min="1" value="${W}"></label><label>Day<br><select id="ak">${L.map(l=>`<option value="${l[0]}"${l[0]==K?" selected":""}>${l[1]}</option>`).join("")}</select></label>
<label>Subject<br><input id="as" value="${["Maths","Verbal Reasoning","Maths","English","Non-Verbal Reasoning","Mixed quiz"][i]}"></label><label>Time taken (min)<br><input id="at" type="number" min="0"></label>
<label>Score<br><input id="asc" type="number" min="0"></label><label>Out of<br><input id="am" type="number" min="1" value="${[14,10,14,12,11,10][i]}"></label></div>
<label>Mistakes, one per line: <code>Q | question | answered | correct | skill</code><br><textarea id="aw2" rows="5" placeholder="7 | Next: Z, X, V, T | V | R | Sequences"></textarea></label>
${UI?'<label>Photo of the marked test (optional)<br><input id="af" type="file" accept="image/*"></label>':""}
<p><button class="pri" onclick="save()">Save</button> <button onclick="exp()">Export data.json</button></p><div id="am2" class="sub">${MSG}</div><pre id="aj" style="white-space:pre-wrap;font-size:12px"></pre></div>`}
async function save(){const w=+$("aw").value,k=$("ak").value,id=`w${w}-${k}`,wr=$("aw2").value.split("\n").map(s=>s.split("|").map(x=>x.trim())).filter(a=>a.length>=5).map(a=>[+a[0]||a[0],a[1],a[2],a[3],a[4]]);
const r={id,w,k,s:$("as").value,sc:+$("asc").value,mx:+$("am").value,t:+$("at").value||null,wr};if(isNaN(r.sc)||!r.mx||$("asc").value==="")return $("am2").textContent="Please enter the score.";
const f=UI&&$("af")?$("af").files[0]:null;if(f){try{const A=await claude.use("assets");if(A)r.img=(await A.upload(f)).url}catch(e){$("am2").textContent="Scan upload failed; saving marks only."}}
if(!UI)r.img=`assets/scans/week${w}/${k}.jpg`;
if(DB){try{await DB.collection("days").doc(id).set(r);MSG="Saved "+id;go("add");return}catch(e){$("am2").textContent="Could not save: "+(e.code||e.message)}}
else{R=R.filter(x=>x.id!=id).concat(r);$("aj").textContent=JSON.stringify(r)+",";$("am2").textContent="Copy this line into data/records.json."}}
async function exp(){const j=JSON.stringify(R.slice().sort((a,b)=>a.w-b.w||li(a.k)-li(b.k)),null,1);try{const d=await claude.use("downloads");if(d){await d.save({filename:"records.json",data:j});return}}catch(e){}
$("aj").textContent=j;$("am2").textContent="Copy this into data/records.json in your repository."}
const TABS={overview:["Overview",over],review:["Question review",rev],scans:["Marked scans",scans],add:["Add day",add],booklets:["Booklets",bk]};
function go(t){if(!TABS[t])t="overview";TAB=t;E.innerHTML=TABS[t][1]();document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));try{history.replaceState(null,"","#"+t)}catch(e){}}
$("nav").innerHTML=Object.keys(TABS).map(k=>`<button data-t="${k}" onclick="go('${k}')">${TABS[k][0]}</button>`).join("");
async function init(){R=seed.slice();go(location.hash.slice(1));
if(UI){try{DB=await claude.use("db");if(DB)DB.collection("days").onSnapshot(s=>{const a=s.docs.map(d=>d.data());if(a.length){R=a;if(TAB!="add")go(TAB)}},()=>{})}catch(e){}}
else{try{const j=await (await fetch("data/records.json")).json();if(j.length){R=j;go(TAB)}}catch(e){}}}
init();
</script></body></html>
